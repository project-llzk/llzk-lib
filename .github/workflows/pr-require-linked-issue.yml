name: Require linked issue

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # This token allows the workflow to check membership in
      # the team listed by CODEOWNERS and to comment on PRs.
      - name: Generate issue triage token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ISSUE_TRIAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-members: read
          permission-pull-requests: read

      - name: Comment when no issue is linked
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const marker = "<!-- require-linked-issue -->";
            const pr = context.payload.pull_request;

            /*
            const fs = require("fs");
            const codeowners = fs.readFileSync(".github/CODEOWNERS", "utf8");
            const codeOwnerTeams = [
              ...new Set(
                codeowners
                  .split(/\r?\n/)
                  .map(line => line.trim())
                  .filter(line => line && !line.startsWith("#"))
                  .flatMap(line => {
                    const ownerTokens = [];
                    for (const token of line.split(/\s+/).slice(1)) {
                      if (token.startsWith("#")) {
                        break;
                      }
                      ownerTokens.push(token);
                    }
                    return ownerTokens;
                  })
                  .filter(owner => /^@[^/\s]+\/[^/\s]+$/.test(owner))
              ),
            ];

            for (const codeOwnerTeam of codeOwnerTeams) {
              const [teamOrg, teamSlug] = codeOwnerTeam.slice(1).split("/");

              try {
                const membership =
                  await github.rest.teams.getMembershipForUserInOrg({
                    org: teamOrg,
                    team_slug: teamSlug,
                    username: pr.user.login,
                  });

                if (membership.data.state === "active") {
                  core.info(
                    `${pr.user.login} is a member of ${codeOwnerTeam}; skipping linked issue reminder.`
                  );
                  return;
                }
              } catch (error) {
                if (error.status === 404) {
                  continue;
                }
                throw error;
              }
            }
            */

            const result = await github.graphql(
              `
                query ($prId: ID!) {
                  node(id: $prId) {
                    ... on PullRequest {
                      closingIssuesReferences(first: 1) {
                        totalCount
                      }
                    }
                  }
                }
              `,
              { prId: pr.node_id }
            );

            const hasLinkedIssue =
              result.node.closingIssuesReferences.totalCount > 0;

            if (hasLinkedIssue) {
              core.info("The pull request has a linked issue.");
              return;
            }

            // Avoid posting the same warning more than once.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              }
            );

            const alreadyCommented = comments.some(
              comment =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );

            if (alreadyCommented) {
              core.info("The warning comment already exists.");
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: [
                marker,
                "This pull request is not linked to an issue.",
                "",
                "Please link the relevant issue using the **Development** section in the sidebar, or add a closing reference such as:",
                "",
                "```",
                "Closes #123",
                "```",
              ].join("\n"),
            });
