name: Formatting check
on:
  # Run whenever a c, cpp, h, or td file is modified in a PR
  pull_request:
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.td'

permissions:
  contents: write # Allow cpp-linter to push formatting fixes.
  pull-requests: write

jobs:
  run-clang-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Lint the PR head, including for PRs from forks.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          # Auto-fix uses the checkout credentials to push to the PR branch.
          persist-credentials: true
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'
      - uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          authToken: '${{ secrets.CACHIX_PUBLIC_TOKEN }}'
      - name: Locate Nix clang tools
        id: clang
        run: |
          # Use the same clang-format as the development environment.
          # shellcheck disable=SC2016
          nix develop .#debugClang --command bash -c \
            'printf "bin=%s\n" "$(dirname "$(command -v clang-format)")"' \
            >> "$GITHUB_OUTPUT"
      - name: Run clang-format
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ steps.clang.outputs.bin }}
          style: file # Use .clang-format.
          tidy-checks: '-*' # Disable clang-tidy; it has a separate workflow.
          extensions: 'c,cpp,h,td'
          files-changed-only: true
          lines-changed-only: true
          ignore: 'build|result|third-party'
          step-summary: true
          file-annotations: true
          # Fork PRs have read-only tokens, so only check formatting there.
          auto-fix: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          thread-comments: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'update' || 'false' }}
          no-lgtm: false
      - name: Fail on diagnostics
        # cpp-linter reports findings without failing the action itself.
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
