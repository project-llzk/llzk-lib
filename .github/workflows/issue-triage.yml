name: Issue triage

# Keep newly opened issues visible to core developers until they are approved or
# leave the review queue.
on:
  # This covers issues opened outside the repository issue forms as well.
  issues:
    types:
      - opened
  schedule:
    # Check daily; reminders are only posted after an issue has waited four weeks.
    - cron: '0 9 * * *'
      timezone: America/Los_Angeles
  # Allow maintainers to run the reminder scan on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Put every new issue into the review queue and notify the core team once.
  notify-new-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    steps:
      # The app token has organization context, allowing its comments to notify
      # the core-developers team rather than rendering the mention as plain text.
      - name: Generate issue triage token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ISSUE_TRIAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-members: read

      - name: Request core developer review
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['under review'],
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                '@project-llzk/core-devs, please review this issue and update its status:',
                '',
                '- Replace `under review` with `approved` if the issue is ready for someone to work on.',
                '- Replace `under review` with `wontfix`, `duplicate`, or another appropriate label if it should not proceed.',
                '- Leave it `under review` if more discussion or information is needed.',
                '',
                '<!-- core-dev-review-reminder -->',
              ].join('\n'),
            });

  # Re-notify the core team every four weeks until an issue leaves `under review`.
  remind-core-developers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Generate issue triage token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ISSUE_TRIAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-members: read

      - name: Find issues due for review reminders
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            // The hidden marker identifies bot comments made by this workflow
            // so reminders are not posted more than once per four-week interval.
            const reminderMarker = '<!-- core-dev-review-reminder -->';
            const reminderIntervalMs = 28 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'open',
                labels: 'under review',
                per_page: 100,
              },
            );

            for (const issue of issues) {
              // GitHub's issues API also returns pull requests.
              if (issue.pull_request) {
                continue;
              }

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                },
              );

              const reminderComments = comments.filter(
                (comment) =>
                  comment.user?.type === 'Bot' &&
                  comment.body?.includes(reminderMarker),
              );
              const lastReminderAt = reminderComments.reduce(
                (latest, comment) =>
                  Date.parse(comment.created_at) > latest
                    ? Date.parse(comment.created_at)
                    : latest,
                Date.parse(issue.created_at),
              );

              if (now - lastReminderAt < reminderIntervalMs) {
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: [
                  '@project-llzk/core-devs, this issue has remained `under review` for four weeks. Please review it and update the label.',
                  '',
                  reminderMarker,
                ].join('\n'),
              });
            }
