repos:
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.8.3
    hooks:
      - id: clang-format
        # Keep this version aligned with the Nix development shell and CI.
        args: [--style=file, --version=23.1.3]
        # Override the upstream C/C++ types to include TableGen files.
        types_or: [file]
        files: '\.(c|cpp|h|td)$'
        exclude: '^(build|result|third-party)/'
