added:
  - Add the `infer-idempotence-attribute` transformation pass to infer and preserve `llzk.idempotent` on function definitions without non-constant global reads, non-local struct member reads, or RAM loads. External declarations are left unchanged.
  - Warn and remove existing `llzk.idempotent` annotations when these reads are found, with a diagnostic note identifying the offending operation. Unannotated functions with these reads remain unannotated without warnings.
