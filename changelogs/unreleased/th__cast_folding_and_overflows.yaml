added:
  - Documentation for cast overflow modes and their safe ranges.
  - Shared `applyIntToFeltOverflow` and `applyFeltToIndexOverflow` helpers for applying cast overflow semantics.
fixed:
  - Assert casts are no longer side-effect-free and speculatable but the other cast kinds remain so.
  - Honor `assert`, `sat`, `wrap`, and `trunc` in cast constant folding and witness interpretation, using reduced felt operands and deferring folding when the field is unspecified.
  - Respect cast overflow semantics in interval analysis, constraint folding, and backends.
  - Reject unsupported cast modes and range checks in PCL, ZKLean, SMT, and R1CS lowering instead of discarding or misinterpreting them.
