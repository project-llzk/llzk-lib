fixed:
  - Prevent incorrect `scf.for` conversion in `llzk-while-to-for` when `llzk.loopbounds`
    has negative bounds, nonpositive steps, or values exceeding the nonnegative index range.
    These loops are now left unchanged with a warning instead of introducing invalid loops or failing casts.
changed:
  - Specify that `llzk.loopbounds` values are signed mathematical integers of arbitrary precision,
    interpreted without field reduction even when the loop variable has a felt type.
