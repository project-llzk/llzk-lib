fixed:
  - In `llzk-while-to-for`, preserve the while induction variable's felt type when remapping it
    into the body of the converted `scf.for` loop.
  - In `llzk-while-to-for`, prevent incorrect `scf.for` conversion when `llzk.loopbounds` has
    negative bounds, nonpositive steps, values exceeding the nonnegative index range, or a
    final induction value that overflows index after the last increment. These loops are now
    left unchanged with a warning instead of introducing invalid loops or failing casts.
  - Materialize annotated loop bounds and steps directly as index constants without field reduction,
    preserving their integer values even when they equal or exceed the induction variable's field modulus.
changed:
  - Specify that `llzk.loopbounds` values are signed mathematical integers of arbitrary precision,
    interpreted without field reduction even when the loop variable has a felt type.
